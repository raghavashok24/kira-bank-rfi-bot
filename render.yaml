# Render Blueprint -- only needed if your Render account offers "New +" ->
# "Blueprint". If not (a manually-created Web Service works exactly the
# same), just make sure the service's Build/Start commands and env vars
# match what's below -- that's all Render needs, nothing else to configure.
#
# The `sync: false` entries are exactly where your Sumsub credentials go:
# Render will NOT read them from this file (so they never touch GitHub) --
# paste the real values into the service's "Environment" tab instead.
#
# FIXED: this file previously used `env: python` to declare the language
# runtime. Render's Blueprint spec renamed that field to `runtime` (see
# render.com/docs/blueprint-spec -- "This field replaces the deprecated
# `env` field") -- `env` is no longer accepted, which is what was causing
# the Blueprint sync error. If you're using a manually-created Web Service
# (not a Blueprint), this file isn't read at all and nothing on your
# service needed to change.
services:
  - type: web
    name: bank-rfi-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SUMSUB_APP_TOKEN
        sync: false          # <-- your rotated app token goes here, in the Render dashboard only
      - key: SUMSUB_SECRET_KEY
        sync: false          # <-- your rotated secret key goes here, in the Render dashboard only
      - key: SUMSUB_WEBHOOK_SECRET_KEY
        sync: false          # <-- secret key shown in Sumsub Dashboard -> Webhook manager; verifies
                              #     incoming webhook calls are really from Sumsub. Strongly recommended,
                              #     not strictly required -- the bot runs without it, just unauthenticated.
      - key: SLACK_BOT_TOKEN
        sync: false          # <-- optional: bot token (starts "xoxb-") from a Slack app with the
                              #     chat:write scope, installed to your workspace. Leave unset to run
                              #     with Slack notifications off -- everything else works the same.
      - key: SLACK_CHANNEL
        sync: false          # <-- optional: channel ID or name (e.g. "#kyt-alerts") the bot has been
                              #     invited to. Both this and SLACK_BOT_TOKEN must be set for Slack
                              #     notifications to turn on.
      - key: SLACK_HIGH_RISK_THRESHOLD
        value: "0.75"         # <-- risk score (0-1) at/above which a newly-changed prediction posts a
                              #     Slack alert. Optional -- 0.75 is the default even if you delete this.
      - key: INGEST_INTERVAL_MINUTES
        value: "60"

# Works as-is on Render's Free plan with zero further changes -- the only
# tradeoff is that the SQLite database (and therefore everything the bot has
# learned) resets whenever the service restarts or redeploys, since Free has
# no persistent disk. If/when a paid plan + payment method is available on
# this account, add persistence with:
#
#     envVars:
#       - key: BOT_DB_PATH
#         value: /data/bank_rfi_bot.db
#     disk:
#       name: bank-rfi-bot-data
#       mountPath: /data
#       sizeGB: 1
#
# and change `plan: starter` (or higher) above so the disk is allowed.
