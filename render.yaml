# Render Blueprint -- only needed if your Render account offers "New +" ->
# "Blueprint". If not (a manually-created Web Service works exactly the
# same), just make sure the service's Build/Start commands and env vars
# match what's below -- that's all Render needs, nothing else to configure.
#
# The two `sync: false` entries are exactly where your Sumsub credentials
# go: Render will NOT read them from this file (so they never touch GitHub)
# -- paste the real values into the service's "Environment" tab instead.
services:
  - type: web
    name: bank-rfi-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUMSUB_APP_TOKEN
        sync: false          # <-- your rotated app token goes here, in the Render dashboard only
      - key: SUMSUB_SECRET_KEY
        sync: false          # <-- your rotated secret key goes here, in the Render dashboard only
      - key: INGEST_INTERVAL_MINUTES
        value: "60"
      # Slack alerting -- pick ONE method, tried in this order:
      #   1. Rotating token: set SLACK_CLIENT_ID + SLACK_CLIENT_SECRET + SLACK_ACCESS_TOKEN + SLACK_REFRESH_TOKEN + SLACK_CHANNEL
      #   2. Static token:   set SLACK_BOT_TOKEN + SLACK_CHANNEL (used only if #1 isn't fully set)
      #   3. Webhook:        set SLACK_WEBHOOK_URL (used only if neither #1 nor #2 is set)
      - key: SLACK_CLIENT_ID
        sync: false          # <-- Slack app's Client ID (Basic Information -> App Credentials), in the Render dashboard only
      - key: SLACK_CLIENT_SECRET
        sync: false          # <-- Slack app's Client Secret, in the Render dashboard only
      - key: SLACK_ACCESS_TOKEN
        sync: false          # <-- starting rotating access token (xoxe.xoxb-... / xoxe.xoxp-...), in the Render dashboard only -- only used once to bootstrap the first refresh
      - key: SLACK_REFRESH_TOKEN
        sync: false          # <-- starting refresh token (xoxe-1-...), in the Render dashboard only -- only used once, a new one is stored internally after that
      - key: SLACK_BOT_TOKEN
        sync: false          # <-- classic non-expiring bot token (xoxb-...) with chat:write scope, in the Render dashboard only -- alternative to the rotating pair above
      - key: SLACK_CHANNEL
        value: "#potential-bank-rfi-alerts"
      - key: SLACK_WEBHOOK_URL
        sync: false          # <-- Slack Incoming Webhook URL, in the Render dashboard only -- only needed if not using either token method above
      - key: SLACK_ALERT_THRESHOLD
        value: "0.7"          # post to Slack when a transaction's predicted risk score is >= this (0-1)

# Works as-is on Render's Free plan with zero further changes -- the only
# tradeoff is that the SQLite database (and therefore everything the bot has
# learned) resets whenever the service restarts or redeploys, since Free has
# no persistent disk. If/when a paid plan + payment method is available on
# this account, add persistence with:
#
#     envVars:
#       - key: BOT_DB_PATH
#         value: /data/bank_rfi_bot.db
#     disk:
#       name: bank-rfi-bot-data
#       mountPath: /data
#       sizeGB: 1
#
# and change `plan: starter` (or higher) above so the disk is allowed.
